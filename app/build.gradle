plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose)
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'com.google.dagger.hilt.android'
    id 'kotlin-kapt'


}

// 전시용 기본값입니다. 실제 설정 파일이나 자격증명을 저장소에 추가하지 않습니다.
def apiBaseUrl = providers.gradleProperty("IPD_API_BASE_URL")
        .orElse("https://example.invalid/")
        .get()
def naverMapClientId = providers.gradleProperty("NAVER_MAP_CLIENT_ID")
        .orElse("YOUR_NAVER_MAP_CLIENT_ID")
        .get()

android {
    namespace 'com.example.ipdapplication'
    compileSdk 36

    defaultConfig {
        applicationId "com.example.ipdapplication"
        minSdk 30
        targetSdk 30
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "API_BASE_URL", "\"${apiBaseUrl}\""
        resValue "string", "naver_map_client_id", naverMapClientId
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
}

dependencies {

    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.activity.compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.graphics
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.compose.material3
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation platform(libs.androidx.compose.bom)
    androidTestImplementation libs.androidx.compose.ui.test.junit4
    debugImplementation libs.androidx.compose.ui.tooling
    debugImplementation libs.androidx.compose.ui.test.manifest

    implementation 'io.github.fornewid:naver-map-compose:1.9.0'
    implementation 'io.github.fornewid:naver-map-location:21.0.2'
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3'
    implementation 'com.jakewharton.retrofit:retrofit2-kotlinx-serialization-converter:1.0.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'com.google.dagger:hilt-android:2.52'
    kapt 'com.google.dagger:hilt-compiler:2.52'
    implementation 'androidx.hilt:hilt-navigation-compose:1.2.0'
    implementation 'com.google.code.gson:gson:2.13.2'
    implementation 'androidx.navigation:navigation-compose:2.8.3'
    // Compose 버전은 위의 version catalog BOM 한 곳에서 정의합니다.
    implementation "androidx.compose.material3:material3-window-size-class"
    implementation "androidx.compose.material:material-icons-extended"
    implementation 'androidx.camera:camera-core:1.3.3'
    implementation 'androidx.camera:camera-camera2:1.3.3'
    implementation 'androidx.camera:camera-lifecycle:1.3.3'
    implementation 'androidx.camera:camera-view:1.3.3'

    // ML Kit Barcode (QR 포함)
    implementation("com.google.mlkit:barcode-scanning:17.2.0")

    // Coil for image loading
    implementation("io.coil-kt:coil-compose:2.6.0")

}
kapt {
    correctErrorTypes = true
}
